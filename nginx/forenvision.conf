# ==============================================================================
# ForenVision AI Production Nginx Configuration
# High-Security Reverse Proxy, HTTPS Termination, Rate Limiting & Vault Isolation
# ==============================================================================

# Backend Gunicorn WSGI Upstream
upstream forenvision_api {
    server 127.0.0.1:5001 fail_timeout=0;
    keepalive 32;
}

# Rate Limiting Zones (IP-based)
# General API: 30 requests/sec with burst buffer of 20
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
# Authentication Endpoints: 5 requests/sec with burst buffer of 5 (brute-force mitigation)
limit_req_zone $binary_remote_addr zone=auth_strict:10m rate=5r/s;

# ------------------------------------------------------------------------------
# 1. HTTP Server - Redirect All Traffic to HTTPS (Port 80 -> 443)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name forenvision.example.com;

    # Let's Encrypt / Certbot Automated Domain Validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Strict 301 Permanent Redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server - Hardened TLS, Security Headers, Static Assets & Reverse Proxy
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name forenvision.example.com;

    # --------------------------------------------------------------------------
    # TLS / SSL Configuration (A+ Modern Profile)
    # --------------------------------------------------------------------------
    ssl_certificate /etc/letsencrypt/live/forenvision.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forenvision.example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/forenvision.example.com/chain.pem;

    # Restrict to Modern TLS 1.2 and TLS 1.3 only
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;

    # Session Cache & Ticket Optimization
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling (Validates certificate revocation without client latency)
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # --------------------------------------------------------------------------
    # Global Security Headers
    # --------------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none';" always;

    # --------------------------------------------------------------------------
    # Request & Upload Limits
    # --------------------------------------------------------------------------
    client_max_body_size 25M;
    client_body_buffer_size 128k;
    client_header_timeout 30s;
    client_body_timeout 60s;
    send_timeout 60s;

    # --------------------------------------------------------------------------
    # Private Evidence Vault Protection (CRITICAL SECURITY INVARIANT)
    # Never allow direct HTTP serving of uploaded evidence artifacts or env files
    # --------------------------------------------------------------------------
    location ~* ^/(uploads|vault|\.git|\.env) {
        deny all;
        return 403;
    }

    # --------------------------------------------------------------------------
    # Frontend SPA Production Build (Vite / React / TypeScript)
    # --------------------------------------------------------------------------
    root /var/www/forenvision/frontend/dist;
    index index.html;

    # Static Vite Chunks with Content Hashing (Safe for 1-year Immutable Caching)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # SPA Client-Side Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
        # Ensure HTML index is never cached so client receives immediate updates
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # --------------------------------------------------------------------------
    # Authentication Rate Limiting
    # --------------------------------------------------------------------------
    location /api/auth/login {
        limit_req zone=auth_strict burst=5 nodelay;
        proxy_pass http://forenvision_api;
        include /etc/nginx/proxy_params_forenvision;
    }

    location /api/auth/register {
        limit_req zone=auth_strict burst=3 nodelay;
        proxy_pass http://forenvision_api;
        include /etc/nginx/proxy_params_forenvision;
    }

    # --------------------------------------------------------------------------
    # Backend Forensic API Reverse Proxy
    # --------------------------------------------------------------------------
    location /api/ {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://forenvision_api;

        # Standard Proxy Headers
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Extended Timeouts for AI Inference, ELA, and PDF Reports
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Streaming Support for Evidence Downloads
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
